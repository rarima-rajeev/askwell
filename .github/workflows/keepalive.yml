name: Keep database awake

# The free Supabase plan pauses a project after about 7 days of low activity.
# This calls /api/health (one small database query) every 3 days so the live demo never goes to sleep.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            https://askwell-ai.vercel.app/api/health
